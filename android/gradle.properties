org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Kotlin incremental compilation trips over paths with spaces / non-ASCII
# characters on some CI machines.  Disabling it here trades a fraction of a
# second of incremental build time for reliable builds on every workstation.
kotlin.incremental=false
